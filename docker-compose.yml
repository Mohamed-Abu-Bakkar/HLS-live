services:
  backend:
    build:
      context: ./HLS-backend
      dockerfile: Dockerfile
    container_name: hotel_backend_api
    restart: unless-stopped
    env_file:
      - ./HLS-backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:-http://hotellisting.mohamedabu.me}
    ports:
      - "5000:5000"
    volumes:
      - hotel_uploads:/app/src/uploads
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hotel-network

  frontend:
    build:
      context: ./HLS-frontend
      dockerfile: Dockerfile
    container_name: hotel_frontend_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hotel-network

volumes:
  hotel_uploads:
    name: hotel_uploads
    external: true

networks:
  hotel-network:
    name: hotel-network
    driver: bridge
